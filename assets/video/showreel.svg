<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#1a1a2e"/>
<stop offset="0.5" stop-color="#16213e"/>
<stop offset="1" stop-color="#0f3460"/>
</linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.3" r="0.4">
<stop offset="0" stop-color="#ff5a3c" stop-opacity="0.6"/>
<stop offset="1" stop-color="transparent"/>
</radialGradient>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#ff5a3c"/>
<stop offset="1" stop-color="#ffb84a"/>
</linearGradient>
<radialGradient id="bubble" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#ff8c5a" stop-opacity="0.8"/>
<stop offset="1" stop-color="#ff5a3c" stop-opacity="0"/>
</radialGradient>
</defs>

<!-- Background -->
<rect width="1920" height="1080" fill="url(#sky)"/>
<rect width="1920" height="1080" fill="url(#glow)"/>

<!-- Animated particles (stars) -->
<g fill="#fff" opacity="0.7">
<circle cx="200" cy="120" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
<circle cx="450" cy="80" r="1"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/></circle>
<circle cx="720" cy="200" r="1.5"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite"/></circle>
<circle cx="980" cy="60" r="1"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.2s" repeatCount="indefinite"/></circle>
<circle cx="1280" cy="140" r="1.5"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
<circle cx="1540" cy="220" r="1"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite"/></circle>
<circle cx="1780" cy="100" r="1.5"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.7s" repeatCount="indefinite"/></circle>
<circle cx="100" cy="280" r="1"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.1s" repeatCount="indefinite"/></circle>
<circle cx="380" cy="380" r="1.5"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite"/></circle>
<circle cx="650" cy="340" r="1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.8s" repeatCount="indefinite"/></circle>
<circle cx="920" cy="420" r="1.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.9s" repeatCount="indefinite"/></circle>
<circle cx="1180" cy="380" r="1"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.4s" repeatCount="indefinite"/></circle>
<circle cx="1450" cy="460" r="1.5"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite"/></circle>
<circle cx="1700" cy="400" r="1"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.3s" repeatCount="indefinite"/></circle>
</g>

<!-- Central rotating element -->
<g transform="translate(960 540)">
<circle r="280" fill="none" stroke="url(#ring)" stroke-width="1" stroke-dasharray="4 8" opacity="0.4">
<animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
</circle>
<circle r="200" fill="none" stroke="url(#ring)" stroke-width="1" opacity="0.6">
<animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="25s" repeatCount="indefinite"/>
</circle>
<circle r="120" fill="url(#bubble)"/>

<!-- Central text -->
<text text-anchor="middle" y="-20" font-family="Inter, system-ui" font-size="48" font-weight="900" fill="#fff" letter-spacing="-2">AGUITECH</text>
<text text-anchor="middle" y="30" font-family="JetBrains Mono, monospace" font-size="14" fill="#ff5a3c" letter-spacing="6">SHOWREEL · 2026</text>
<text text-anchor="middle" y="70" font-family="Inter, system-ui" font-size="14" fill="rgba(255,255,255,0.6)" letter-spacing="3">MARKETING · TECNOLOGÍA · DISEÑO</text>
</g>

<!-- Floating UI cards -->
<g opacity="0.5">
<rect x="80" y="850" width="280" height="80" rx="14" fill="rgba(255,255,255,0.05)" stroke="#ff5a3c" stroke-width="1">
<animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite"/>
</rect>
<text x="100" y="900" font-family="JetBrains Mono, monospace" font-size="14" fill="#ff5a3c">+240 PROJECT</text>
<text x="100" y="920" font-family="JetBrains Mono, monospace" font-size="11" fill="rgba(255,255,255,0.5)">DELIVERED</text>

<rect x="1560" y="200" width="280" height="80" rx="14" fill="rgba(255,255,255,0.05)" stroke="#fff" stroke-width="1">
<animate attributeName="opacity" values="0.3;0.7;0.3" dur="4.5s" repeatCount="indefinite"/>
</rect>
<text x="1580" y="250" font-family="JetBrains Mono, monospace" font-size="14" fill="#fff">+50 BRANDS</text>
<text x="1580" y="270" font-family="JetBrains Mono, monospace" font-size="11" fill="rgba(255,255,255,0.5)">TRUST US</text>

<rect x="1500" y="820" width="320" height="80" rx="14" fill="rgba(255,255,255,0.05)" stroke="#ffb84a" stroke-width="1">
<animate attributeName="opacity" values="0.3;0.7;0.3" dur="4.2s" repeatCount="indefinite"/>
</rect>
<text x="1520" y="870" font-family="JetBrains Mono, monospace" font-size="14" fill="#ffb84a">14 YEARS</text>
<text x="1520" y="890" font-family="JetBrains Mono, monospace" font-size="11" fill="rgba(255,255,255,0.5)">BUILDING THE FUTURE</text>
</g>
</svg>
